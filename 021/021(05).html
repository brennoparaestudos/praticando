<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 1.5</title>
</head>
<body>
    <script>
        var C = 45
        var F = (C * 9 / 5) + 32

        window.alert(`Temperatura em Celsius: ${C}º`)
        window.alert(`Temperatura em Fahrenheit: ${F.toFixed(1)}º`)
        
    </script>
</body>
</html>
