<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 1.3</title>
</head>
<body>
    <script>
       var pontos = 0

       window.alert(pontos += 10)
       window.alert(pontos += 5)
       window.alert(pontos -= 3)
       window.alert(`O resultado final é: ${pontos}`)
    </script>
</body>
</html>
