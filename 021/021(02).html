<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 1.2</title>
</head>
<body>
    <script>
       var n1 = 5
       var n2 = 5
       var soma = Number(n1) + Number(n2)
       var subtração = Number(n1) - Number(n2)
       var multiplicação = Number(n1) * Number(n2)
       var divisão = Number(n1) / Number(n2)
       var modulo = Number(n1) % Number(n2)

       window.alert(soma)
       window.alert(subtração)
       window.alert(multiplicação)
       window.alert(divisão)
       window.alert(modulo)
    </script>
</body>
</html>
