<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 1.4</title>
</head>
<body>
    <script>
       window.alert(5 == "5") /* O valor é o mesmo, somente o tipo primitivo é diferente, por isso retorna true */
       window.alert(5 === "5") /*O valor é o mesmo, porém como não são do mesmo tipo primitivo eles acabam não sendo identicos, por isso retorna false */
    </script>
</body>
</html>
