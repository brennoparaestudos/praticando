<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 4.4</title>
</head>
<body>
    <script>
        var a = 0
        var b = 1
        var temp
        var i = 1

        while(i <= 10){

            alert(`${a}`)
            temp = a + b
            a = b
            b = temp
            i++
        }
        
    </script>
</body>
</html>
