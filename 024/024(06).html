<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 4.6</title>
</head>
<body>
    <script>
        var numero = 37
        var primo = true
        var i

        for(i = 2; i <=36; i++){
            if(numero % i == 0){
                primo = false
                
            }
        }

        alert(`O número ${numero} é primo?\n ${primo}`)
    </script>
</body>
</html>
