<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 4.5</title>
</head>
<body>
    <script>
        var l
        var c
        var triangulo = ''
        var fila

        for(l = 1; l <= 5; l++){

            fila = ''

            for(c = 1; c <= l; c++){

                fila = fila + '*'

            }
            
            triangulo = triangulo + fila + '\n'

        }
        alert(triangulo)
    </script>
</body>
</html>
