<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apenas praticando 20.1 </title>
    <style>
        .card {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .card img {
            width: 300px;
            height: 300px;
        }
        .legenda {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.038);
            color: white;
            text-align: left;
            padding: .7px 
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://picsum.photos/300/300" >
        <span class="legenda">Minha Foto</span>
    </div>
</body>
