<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando JS 2.5</title>
</head>
<body>
    <button>
        Clique
    </button>

    <script>
        var clicou = document.getElementsByTagName('button')[0]

        clicou.addEventListener('click', clicar)

        function clicar(){
            alert('Você clicou!')
        }
    </script>
</body>
</html>
